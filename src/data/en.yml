  title: "Happy the Year of the Dragon!"
  text: "MqyGalaxy|Blog \"The New Year Event\" is now open. If you participate in
    the New Year event, you can get the blog's Year of the Dragon Yuru-chara
    \"Xuexia\", \"Yuexuan\", and New Year greeting pictures! Watch the 2023
    Year-end Summary of MqyGalaxy|Blog to learn about the footprints left by the
    blog last year. Thanks for meeting you~!"

  about:
    title: "About MOEQY"
    text1: "MOEQY is a personal website built and managed by MqyGalaxy. Here for
      practicing techniques and sharing things we love! We committed to ACG
      (Anime, Comics, Games), Video Production, MMD, Web Design, etc."
    text2: "MOEQY collects our growth step by step. Publish our own learning
      experience and works here, and share more things with everyone."
  detailed:
    title: "INTERESTS & CREATION"
    menu:
      acgn: ACGN
      video: Media
      game: Game
      more: More
    acgn:
      text: "ACGN is generally interpreted as the collective abbreviation of Anime,
        Comics, Games, and Novels. ACGN is a vibrant subcultural community.
        MOEQY has been actively creating works related to ACG."
    video:
      text: "Today, personal media and internet video have gradually become the
        mainstream way for people to disseminate and understand information.
        People also prefer platforms that allow them to create freely."
    game:
      text: "Game is also known as the art. Now, games have become a new way for
        people to create. Many excellent creators create information worlds,
        allowing players to experience the stories they want to express."
    more:
      text: "MOEQY will learn more knowledge!"
