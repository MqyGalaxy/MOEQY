  title: MyBlogより、辰年の幸せをお祈りします！
  text: 'MqyGalaxy|Blogの新春企画が始まりました。参加すると、辰年の看板娘「雪霞」と「玥炫」の立ち絵や、2024年の年賀イラストをご覧いただけます。2023年の振り返りで、ブログの一年の歩みもぜひご覧ください。出会いに感謝します！'
  about:
    title: MOEQYについて
    text1: MOEQYはMqyGalaxyが制作・管理する個人サイトです。技術を学びながら、好きなものを共有しています。ACG（アニメ・漫画・ゲーム）、動画制作、MMD、Web制作などに取り組んでいます。
    text2: MOEQYは作品を集めながら、一歩ずつの成長を記録する場所です。学んだことや作品を公開し、いろいろなことを皆さんと分かち合えたらと思っています。
  detailed:
    title: 好きなことと創作
    menu:
      acgn: ACGN
      video: メディア
      game: ゲーム
      more: その他
    acgn:
      text: ACGNはAnime（アニメ）、Comics（漫画）、Games（ゲーム）、Novels（小説）の頭文字です。多彩なサブカルチャーが集まる世界であり、「二次元」はアニメや漫画、ゲームなどに描かれる世界の呼び名でもあります。MOEQYでは、こうした分野の創作を続けています。
    video:
      text: 個人メディアやネット動画は、情報を発信し、知るための身近な手段になりました。誰もが自由に創作できる場所で、新しい表現が生まれています。
    game:
      text: ゲームもまた、ひとつの芸術です。クリエイターが世界をつくり、その物語をプレイヤーが体験する、新しい表現のかたちになっています。
    more:
      text: MOEQYは、これからもさまざまなことを学んでいきます！
  window:
    text: プライバシーポリシーを2025年7月8日に更新しました。
    link: 最新の内容
    end: をご確認ください。
