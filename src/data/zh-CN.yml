  title: "MyBlog 祝各位龙年大吉！"
  text: "MqyGalaxy | Blog
    新春活动现已开启，参与新春活动可获得小站的龙年看板娘“雪霞”和“玥炫”的立绘，以及可以获得我们的2024新年贺图！观看2023年
    MqyGalaxy|Blog 了解小站在去年留下的足迹。 感谢与您相遇~！"

  about:
    title: "关于萌趣MOEQY"
    text1: "萌趣是一个个人性质的网站，由 MqyGalaxy
      搭建和管理。网站用于练习技术以及分享自己喜欢的事情！目前致力于ACG（番剧/动漫、漫画、游戏）、视频制作、MMD、网页制作等。"
    text2: "萌趣作为一个作品集收集着我一步又一步的成长。将自己的学习心得和作品发布在萌趣MOEQY中，分享给大家更多事物。"
  detailed:
    title: "兴趣与创作"
    menu:
      acgn: ACGN
      video: 媒体
      game: 游戏
      more: 更多
    acgn:
      text: "ACGN一般解释为Anime（动漫）、Comics（漫画）、Games（游戏）、Novels（小说）合称的缩写。ACGN是一种充满活力的次文化社\
        区，而二次元则是ACGN次文化中对于动画、漫画、游戏等作品中虚构世界的一种称呼用语。萌趣一直在活跃创作ACG相关作品。"
    video:
      text: "在如今，自媒体和视频逐渐成为了人们传播和了解信息的主流方式。人们也更加喜欢能够发挥自由创作的平台。"
    game:
      text: "游戏也被称之为“第九艺术”。在现在，游戏已经成为人们创作的全新方式，许多优秀的创作者们创造信息世界，让玩家们身临其境感受他们想要表达的故事。"
    more:
      text: "萌趣还会学习更多的知识！"
  window:
    text: "萌趣MOEQY 的《隐私协议》已经于2025年7月8日更新。详情请查看最新的 "
    link: "隐私协议"
    end: "。"

